<div onclick="event.stopPropagation()">
	{{ include.text }}<b>{{ include.speaker }}</b><br>
	<p onClick="showTalkInfo('{{ include.text }}{{ include.speaker }}')">{{ include.title }}</p>
	{% if include.title %}<a onclick="showTalkInfo('{{ include.text }}{{ include.speaker }}')" class="talk-info-button">[More Info]</a>{% endif %}
	<div style="display:none" class="talk-info" id="{{ include.text }}{{ include.speaker }}">
		<button onclick="hideTalkInfo('{{ include.text }}{{ include.speaker }}')" style="position:absolute;right:5px;cursor:pointer">✖</button>
		<h2>{{ include.speaker }}</h2>
		<h3>{{ include.title }}</h3>
		<p>{{ include.abstract }}</p>
	</div>
</div>
