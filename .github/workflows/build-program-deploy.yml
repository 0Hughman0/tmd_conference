# This is a basic workflow to help you get started with Actions

name: Build Program CSVs and Deploy to Demo

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
     branches: [ "demo" ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
          
      ####### Buid the program csvs ###################
                      
      - name: "get files"
        run: curl -L -o "program.xlsx" "https://docs.google.com/uc?export=download&id=1hu7gxom_zlH_HVzS48i7wUDgGXDm-4ZS"
    
      - name: "check all good"
        run: ls -R
    
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt
      - run: python create_program_csvs.py
        
      - name: check it's there
        run: ls -R
        
      ####### Buid the website ###################

      - uses: actions/cache@v2
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - uses: helaili/jekyll-action@v2
        with:
            build_only: true
            jekyll_src: tmd_conference
            gem_src: tmd_conference
            build_dir: ../dcuenvoieuriewud2dhfhf

      - name: check for errors!
        run: git status -uno --porcelain
        
      - name: check it's there
        run: ls -R
        
      ####### Deploy the website ###################
        
      - name: SFTP Deploy
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_ADDRESS }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: "${{ secrets.PASSWORD }}"
          local_path: dcuenvoieuriewud2dhfhf/
          # known-hosts: ssh-rsa 
          remote_path: /home/msm2dm/www/www.2dtmds2023.com/
          
          
        
          

            
            
