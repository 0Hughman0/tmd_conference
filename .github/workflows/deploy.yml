# This is a basic workflow to help you get started with Actions

name: Deploy Website

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "demo" ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
      
      - uses: actions/cache@v2
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - uses: helaili/jekyll-action@v2
        with:
            build_only: true
            jekyll_src: tmd_conference
            gem_src: tmd_conference
            build_dir: ./_site

      - name: Store built website
        uses: actions/upload-artifact@v2
        with: 
            name: production-files
            path: ./_site

      #- name: Retrieve site
      #  uses: actions/upload-artifact@v2
      #  with: 
      #      name: production-files
      #      path: ./build

      - name: check for errors!
        run: git status -uno --porcelain
        
      - name: check it's there
        run: ls -R
        
      - name: FTP Deploy to WP Engine (Staging)
        uses: SamKirkland/FTP-Deploy-Action@3.1.1
        with:
          ftp-server: ${{ secrets.SFTP_ADDRESS }}/home/msm2dm/www/www.2dtmds2023.com/dcuenvoieuriewud2dhfhf/
          ftp-username: ${{ secrets.SFTP_USERNAME }}
          ftp-password: ${{ secrets.PASSWORD }}
          local-dir: ./_site
          # known-hosts: ssh-rsa 
          git-ftp-args: --insecure
          
          
        
          

            
            
