# This is a basic workflow to help you get started with Actions

name: Deploy Website

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "demo" ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - uses: actions/cache@v2
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - uses: helaili/jekyll-action@v2
        with:
            build_only: true
            jekyll_src: tmd_conference
            gem_src: tmd_conference
            build_dir: ../dcuenvoieuriewud2dhfhf

      - name: Store built website
        uses: actions/upload-artifact@v2
        with: 
            name: production-files
            path: ./dcuenvoieuriewud2dhfhf

      #- name: Retrieve site
      #  uses: actions/upload-artifact@v2
      #  with: 
      #      name: production-files
      #      path: ./build

      - name: check for errors!
        run: git status -uno --porcelain
        
      - name: check it's there
        run: ls -R
        
      - name: FTP/SFTP file deployer
        uses: milanmk/actions-file-deployer@1.11
        with:
          remote-host: ${{ secrets.SFTP_ADDRESS }}
          remote-user: ${{ secrets.SFTP_USERNAME }}
          remote-password: ${{ secrets.PASSWORD }}
          local-path: dcuenvoieuriewud2dhfhf/
          # known-hosts: ssh-rsa 
          remote-path: /home/msm2dm/www/www.2dtmds2023.com/
          
          
        
          

            
            
